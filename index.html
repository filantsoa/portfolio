<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Master - Mode Ariary</title>
    <style>
        /* Variables de design */
        :root {
            --bg-dark: #1a1a2e;
            --canvas-bg: #16213e;
            --snake-head: #4ecca3;
            --snake-body: #45b293;
            --food-color: #e94560;
            --text-color: #ffffff;
            --primary: #00adb5;
            --success: #4ecca3;
            --danger: #e94560;
            --money: #ffd700; /* Couleur Or */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            position: relative;
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 10px;
        }

        h1 {
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .stats-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .user-display {
            font-size: 1rem;
            color: var(--primary);
            font-weight: bold;
        }

        .badges-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .level-badge { background-color: var(--danger); }
        .money-badge { 
            background-color: #0f3460; 
            border: 1px solid var(--money);
            color: var(--money);
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        #gameCanvas {
            background-color: var(--canvas-bg);
            border: 4px solid #0f3460;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
            max-width: 100%;
            touch-action: none;
        }

        /* Overlay */
        #overlayMessage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
            padding: 20px;
        }

        #msgTitle { font-size: 1.8rem; margin-bottom: 10px; }
        #msgBody { font-size: 1rem; margin-bottom: 20px; line-height: 1.4; white-space: pre-line; }

        .input-group { margin-bottom: 20px; width: 100%; }
        input[type="text"] {
            width: 100%; padding: 12px; border-radius: 25px;
            border: 2px solid var(--primary); background: var(--bg-dark);
            color: white; font-size: 1rem; text-align: center;
        }

        /* Contrôles tactiles (D-Pad) */
        .controls-mobile {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            width: 200px;
            margin: 0 auto;
        }

        .control-btn {
            background: #0f3460;
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #0a2544;
            transition: all 0.1s;
        }

        .control-btn:active {
            transform: translateY(4px);
            box-shadow: none;
            background: var(--primary);
        }

        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .btn {
            padding: 12px 25px; border-radius: 50px; border: none;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-success { background-color: var(--success); color: #1a1a2e; }

        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-money { color: var(--money); }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Snake Master</h1>
    
    <div class="stats-container">
        <div id="playerNameDisplay" class="user-display">Joueur : ---</div>
        <div class="badges-row">
            <div class="badge level-badge">Niveau: <span id="levelVal">1</span></div>
            <div class="badge money-badge">Argent: <span id="scoreVal">0</span> Ar</div>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="overlayMessage">
            <h2 id="msgTitle">Bienvenue</h2>
            <div id="inputArea" class="input-group">
                <p id="msgBody">Entrez votre nom pour jouer :</p>
                <input type="text" id="usernameInput" placeholder="Votre nom..." maxlength="12">
            </div>
            <button id="btnAction" class="btn btn-success">Jouer</button>
        </div>
    </div>

    <div class="controls-mobile">
        <button class="control-btn btn-up" onmousedown="setDir(0,-1)" ontouchstart="setDir(0,-1)">▲</button>
        <button class="control-btn btn-left" onmousedown="setDir(-1,0)" ontouchstart="setDir(-1,0)">◀</button>
        <button class="control-btn btn-down" onmousedown="setDir(0,1)" ontouchstart="setDir(0,1)">▼</button>
        <button class="control-btn btn-right" onmousedown="setDir(1,0)" ontouchstart="setDir(1,0)">▶</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('scoreVal');
    const levelElement = document.getElementById('levelVal');
    const overlay = document.getElementById('overlayMessage');
    const msgTitle = document.getElementById('msgTitle');
    const msgBody = document.getElementById('msgBody');
    const inputArea = document.getElementById('inputArea');
    const usernameInput = document.getElementById('usernameInput');
    const playerNameDisplay = document.getElementById('playerNameDisplay');
    const btnAction = document.getElementById('btnAction');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let username = "";
    let snake = [];
    let foods = []; 
    let dx = 0;
    let dy = 0;
    let score = 0; 
    let currentLevel = 1;
    let foodToEatInLevel = 5;
    
    let gameRunning = false;
    let gameLoop;
    let speed = 150;

    btnAction.onclick = () => {
        const val = usernameInput.value.trim();
        username = val === "" ? "Anonyme" : val;
        playerNameDisplay.innerText = `Joueur : ${username}`;
        startLevel(1);
    };

    function setDir(newDx, newDy) {
        if (!gameRunning) return;
        if (newDx === -dx && newDx !== 0) return;
        if (newDy === -dy && newDy !== 0) return;
        dx = newDx;
        dy = newDy;
    }

    function startLevel(level) {
        currentLevel = level;
        foodToEatInLevel = 5 * level;
        foods = [];
        
        if (level === 1) {
            snake = [{x: 10, y: 10}];
            score = 0;
            scoreElement.innerText = "0";
        } else {
            const oldSnake = [...snake];
            const offset = { x: 10 - oldSnake[0].x, y: 10 - oldSnake[0].y };
            snake = oldSnake.map(part => ({
                x: (part.x + offset.x + tileCount) % tileCount,
                y: (part.y + offset.y + tileCount) % tileCount
            }));
        }
        
        for(let i = 0; i < foodToEatInLevel; i++) generateFood();
        
        levelElement.innerText = currentLevel;
        dx = 1; dy = 0;
        overlay.style.display = 'none';
        gameRunning = true;
        
        if(gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(main, speed);
    }

    function main() {
        if (didGameEnd()) { showGameOver(); return; }
        clearCanvas();
        drawFoods();
        advanceSnake();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = "#16213e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
        for(let i=0; i<canvas.width; i+=gridSize) {
            ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = (index === 0) ? "#4ecca3" : "#45b293";
            ctx.strokeStyle = "#1a1a2e";
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2, 4);
            else ctx.rect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.fill(); ctx.stroke();
        });
    }

    function advanceSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);
        let foodEatenIndex = foods.findIndex(f => f.x === snake[0].x && f.y === snake[0].y);
        if (foodEatenIndex !== -1) {
            score += 500; // 500 Ar par nourriture mangée
            scoreElement.innerText = score;
            foods.splice(foodEatenIndex, 1);
            if (foods.length === 0) {
                gameRunning = false;
                clearInterval(gameLoop);
                showLevelComplete();
            }
        } else {
            snake.pop();
        }
    }

    function didGameEnd() {
        if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
        }
        return false;
    }

    function generateFood() {
        let newFood;
        let isValid = false;
        while(!isValid) {
            newFood = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            let onSnake = snake.some(part => part.x === newFood.x && part.y === newFood.y);
            let onFood = foods.some(f => f.x === newFood.x && f.y === newFood.y);
            if(!onSnake && !onFood) isValid = true;
        }
        foods.push(newFood);
    }

    function drawFoods() {
        foods.forEach(f => {
            ctx.fillStyle = "#ffd700"; 
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffd700";
            ctx.beginPath();
            ctx.arc(f.x * gridSize + gridSize/2, f.y * gridSize + gridSize/2, gridSize/3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }

    function showLevelComplete() {
        inputArea.style.display = 'none';
        msgTitle.innerText = "Niveau terminé !";
        msgTitle.className = "text-success";
        msgBody.innerText = `Bravo ${username} !\nVous avez cumulé ${score} Ar.\nPrêt pour la suite ?`;
        btnAction.innerText = "Récupérer la somme";
        btnAction.onclick = () => startLevel(currentLevel + 1);
        overlay.style.display = 'flex';
    }

    function showGameOver() {
        gameRunning = false;
        clearInterval(gameLoop);
        inputArea.style.display = 'none';
        msgTitle.innerText = "FIN DE PARTIE";
        msgTitle.className = "text-danger";
        msgBody.innerText = `Désolé ${username}.\nCagnotte finale : ${score} Ar`;
        btnAction.innerText = "Recommencer";
        btnAction.onclick = () => startLevel(1);
        overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'z') setDir(0, -1);
        if (k === 'arrowdown' || k === 's') setDir(0, 1);
        if (k === 'arrowleft' || k === 'q') setDir(-1, 0);
        if (k === 'arrowright' || k === 'd') setDir(1, 0);
    });

    clearCanvas();
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.textAlign = "center";
    ctx.font = "16px Arial";
    ctx.fillText("Entrez votre nom pour jouer", canvas.width/2, canvas.height/2);
</script>
</body>
</html>
